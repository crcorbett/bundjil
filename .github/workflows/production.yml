name: Production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production-crcorbett-bundjil
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository == 'crcorbett/bundjil' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'crcorbett/bundjil'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    env:
      BUNDJIL_PRODUCTION_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      BUNDJIL_PRODUCTION_VERCEL_TEAM_ID: ${{ vars.BUNDJIL_PRODUCTION_VERCEL_TEAM_ID }}
      BUNDJIL_PRODUCTION_AGENT_VERCEL_PROJECT_ID: ${{ vars.BUNDJIL_PRODUCTION_AGENT_VERCEL_PROJECT_ID }}
      BUNDJIL_PRODUCTION_PROXY_VERCEL_PROJECT_ID: ${{ vars.BUNDJIL_PRODUCTION_PROXY_VERCEL_PROJECT_ID }}
      BUNDJIL_PRODUCTION_PROXY_HEALTH_URL: ${{ vars.BUNDJIL_PRODUCTION_PROXY_HEALTH_URL }}
      BUNDJIL_PRODUCTION_AGENT_VERCEL_TOKEN: ${{ secrets.BUNDJIL_PRODUCTION_AGENT_VERCEL_TOKEN }}
      BUNDJIL_PRODUCTION_PROXY_VERCEL_TOKEN: ${{ secrets.BUNDJIL_PRODUCTION_PROXY_VERCEL_TOKEN }}

    steps:
      - name: Checkout accepted main SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BUNDJIL_PRODUCTION_SOURCE_SHA"
          test "$(git remote get-url origin)" = "https://github.com/crcorbett/bundjil"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Stage, verify and promote exact main SHA
        run: bun run production:deploy
